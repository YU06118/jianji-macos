name: macOS Release
# 推送 v* 标签触发：Intel(x86_64) 与 Apple Silicon(aarch64) 分别构建 → minisign 签名 → 创建 Release（含 latest.json）
# 手动触发只构建并上传 artifact，不发布 Release。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x64
          - target: aarch64-apple-darwin
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps
        working-directory: desktop
        run: npm install

      - name: Build bundle (app + dmg)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  publish:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts to ASCII
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p dist
          for arch in x64 aarch64; do
            src="artifacts/macos-${arch}"
            # upload-artifact 会按公共祖先保留 bundle/dmg、bundle/macos 子目录，需递归查找
            dmg=$(find "$src" -type f -name '*.dmg' -print -quit)
            pkg=$(find "$src" -type f -name '*.app.tar.gz' -print -quit)
            sig=$(find "$src" -type f -name '*.app.tar.gz.sig' -print -quit)
            test -n "$dmg" || { echo "missing .dmg in $src" >&2; exit 1; }
            test -n "$pkg" || { echo "missing .app.tar.gz in $src" >&2; exit 1; }
            test -n "$sig" || { echo "missing .app.tar.gz.sig in $src" >&2; exit 1; }
            cp "$dmg" "dist/jianji_${VERSION}_${arch}.dmg"
            cp "$pkg" "dist/jianji_${VERSION}_${arch}.app.tar.gz"
            cp "$sig" "dist/jianji_${VERSION}_${arch}.app.tar.gz.sig"
          done
          ls -l dist

      - name: Generate latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          tag = os.environ['TAG']
          repo = os.environ['REPO']
          version = tag[1:] if tag.startswith('v') else tag

          platforms = {}
          for arch, platform in (('x64', 'darwin-x86_64'), ('aarch64', 'darwin-aarch64')):
              with open(f'dist/jianji_{version}_{arch}.app.tar.gz.sig', encoding='utf-8') as f:
                  signature = f.read()
              platforms[platform] = {
                  'signature': signature,
                  'url': f'https://github.com/{repo}/releases/download/{tag}/jianji_{version}_{arch}.app.tar.gz',
              }

          data = {
              'version': version,
              'notes': '详见 Release 页',
              'pub_date': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms,
          }
          with open('dist/latest.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(open('dist/latest.json', encoding='utf-8').read())
          PY

      - name: Create or reuse Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          {
            echo "简记 ${VERSION} macOS 版。"
            echo ""
            echo "- Intel（x86_64）：jianji_${VERSION}_x64.dmg"
            echo "- Apple Silicon（arm64）：jianji_${VERSION}_aarch64.dmg"
            echo "- 应用未签名：首次打开请右键 → 打开（或在「系统设置 → 隐私与安全性」中允许）。"
            echo "- 应用内自动更新需要把「简记.app」拖入 /Applications 后使用。"
          } > notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "简记 ${TAG} (macOS)" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "简记 ${TAG} (macOS)" --notes-file notes.md
          fi

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          echo "Release assets uploaded"
